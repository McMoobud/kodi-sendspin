# Copy to repo.local.ini (gitignored) and edit. Used by tools/build_repo.py.
[repo]
# Public URL that serves the dist/repo/ folder (add this as a source in Kodi's File manager)
url = https://example.com/kodi/
# Name shown in Kodi's add-on browser
name = Kodi-Sendspin repository
provider = Kodi-Sendspin
# Optional rsync target for `build_repo.py --publish`
# publish = user@host:/var/www/kodi/
